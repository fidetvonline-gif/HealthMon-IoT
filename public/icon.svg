<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- IoT Wireless Waves (Top Right) -->
  <path d="M 330 150 A 60 60 0 0 1 370 190" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 355 125 A 95 95 0 0 1 420 190" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Center Medical Cross / Shield Accent Backdrop -->
  <path d="M 256 120 L 340 160 V 270 C 340 330 290 380 256 400 C 222 380 172 330 172 270 V 160 Z" fill="#1e293b" stroke="#334155" stroke-width="6" stroke-linejoin="round"/>

  <!-- ECG Heartbeat Pulse Line -->
  <path d="M 120 260 L 190 260 L 215 210 L 245 320 L 275 180 L 305 290 L 325 260 L 390 260" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Core IoT Sensor Node Dot -->
  <circle cx="275" cy="180" r="10" fill="#ffffff" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="245" cy="320" r="8" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
</svg>
